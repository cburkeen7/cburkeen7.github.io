<div class="modal-background">
  <div class="modal-container">
    <h2>Filter & Sort</h2>

    <label>Species</label>
    <input [(ngModel)]="filters.species" placeholder="Dog, Monkey, etc." />

    <label>Training Status</label>
    <select [(ngModel)]="filters.trainingStatus">
      <option value="">Any</option>
      <option value="Intake">Intake</option>
      <option value="In Training">In Training</option>
      <option value="Ready for Service">Ready for Service</option>
    </select>

    <label>Reserved?</label>
    <select [(ngModel)]="filters.reserved">
      <option value="">Any</option>
      <option value="true">Reserved</option>
      <option value="false">Not Reserved</option>
    </select>

    <label>Sort By</label>
    <select [(ngModel)]="sortOption">
      <option value="">None</option>
      <option value="age">Age</option>
      <option value="name">Name</option>
    </select>

    <div class="button-row">
      <button class="save-btn" (click)="save()">Apply</button>
      <button class="cancel-btn" (click)="cancel()">Cancel</button>
    </div>
  </div>
</div>

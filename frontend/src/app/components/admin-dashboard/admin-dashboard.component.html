<!-- Top Navigation Bar -->
<nav class="navbar">
  <div class="navbar-left">
    <img src="images/Logo.png" alt="Logo" class="navbar-logo" />
  </div>

  <div class="navbar-right">
    <button class="logout-btn" (click)="logout()">Logout </button>
  </div>
</nav>

<!-- Controls Section -->
<section class="controls">
  <button class="control-btn" (click)="openAddAnimal()">Add Animal</button>
  <button class="control-btn" (click)="showFilterSortModal = true">Filter & Sort</button>
</section>

<!-- Cards Grid Section -->
<section class="animal-grid">
  <app-animal-card
    *ngFor="let animal of displayedAnimals"
    [animal]="animal"
    (edit)="openEditAnimal(animal)"
    (delete)="openDeleteConfirm(animal)"
  ></app-animal-card>
</section>

<!-- Add Animal Modal -->
<app-add-animal
  *ngIf="showAddForm"
  (cancel)="showAddForm = false"
  (add)="addAnimalToList($event)"
></app-add-animal>

<!-- Edit Animal Modal -->
<app-edit-animal
  *ngIf="showEditForm"
  [animal]="selectedAnimal"
  (updated)="onAnimalUpdated($event)"
  (close)="showEditForm = false"
></app-edit-animal>

<!-- Delete Modal -->
<app-delete-animal
  *ngIf="showDeleteModal"
  [animal]="animalToDelete"
  (confirm)="confirmDelete()"
  (cancel)="cancelDelete()"
></app-delete-animal>

<!-- Filter/Sort Modal -->
<app-filter-sort
  *ngIf="showFilterSortModal"
  (apply)="applyFilterSort($event)"
  (close)="showFilterSortModal = false"
></app-filter-sort>

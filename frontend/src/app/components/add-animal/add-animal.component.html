<div class="modal-background">
  <div class="modal-container">
    <h2>Add New Animal</h2>

    <label>Name</label>
    <input [(ngModel)]="newAnimal.name" />

    <label>Species</label>
    <input [(ngModel)]="newAnimal.species" />

    <label>Gender</label>
    <select [(ngModel)]="newAnimal.gender">
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>

    <label>Age</label>
    <input type="number" [(ngModel)]="newAnimal.age" />

    <label>Weight</label>
    <input [(ngModel)]="newAnimal.weight" />

    <label>Training Status</label>
    <select [(ngModel)]="newAnimal.trainingStatus">
      <option value="Intake">Intake</option>
      <option value="In Training">In Training</option>
      <option value="Ready for Service">Ready for Service</option>
    </select>

    <label>Reserved?</label>
    <select [(ngModel)]="newAnimal.reserved">
      <option [ngValue]="true">Yes</option>
      <option [ngValue]="false">No</option>
    </select>

    <label>In Service Country</label>
    <input [(ngModel)]="newAnimal.inServiceCountry" />

    <label>Image</label>
    <input [(ngModel)]="newAnimal.image" />

    <div class="button-row">
      <button class="save-btn" (click)="saveAnimal()">Save</button>
      <button class="cancel-btn" (click)="closeForm()">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-background">
  <div class="modal-container">
    <h2>Edit Animal</h2>

    <label>Name</label>
    <input [(ngModel)]="formAnimal.name" />

    <label>Species</label>
    <input [(ngModel)]="formAnimal.species" />

    <label>Gender</label>
    <select [(ngModel)]="formAnimal.gender">
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>

    <label>Age</label>
    <input type="number" [(ngModel)]="formAnimal.age" />

    <label>Weight</label>
    <input [(ngModel)]="formAnimal.weight" />

    <label>Training Status</label>
    <select [(ngModel)]="formAnimal.trainingStatus">
      <option value="Intake">Intake</option>
      <option value="In Training">In Training</option>
      <option value="Ready for Service">Ready for Service</option>
    </select>

    <label>Reserved?</label>
    <select [(ngModel)]="formAnimal.reserved">
      <option [ngValue]="true">Yes</option>
      <option [ngValue]="false">No</option>
    </select>

    <label>In Service Country</label>
    <input [(ngModel)]="formAnimal.inServiceCountry" />

    <label>Image</label>
    <input [(ngModel)]="formAnimal.image" />

    <div class="button-row">
      <button class="save-btn" (click)="saveChanges()">Save</button>
      <button class="cancel-btn" (click)="closeModal()">Cancel</button>
    </div>
  </div>
</div>
